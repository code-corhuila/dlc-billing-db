databaseChangeLog:
  - changeSet:
      id: billing-007-runtime-permissions
      author: di-lucca
      dbms: postgresql
      changes:
        - sqlFile:
            path: 007_runtime_permissions.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: 007_runtime_permissions_rollback.sql
            relativeToChangelogFile: true

  - changeSet:
      id: billing-009-billable-snapshot-permissions
      author: di-lucca
      dbms: postgresql
      changes:
        - sql:
            sql: GRANT SELECT, INSERT ON billing.encounter_accounts, billing.billable_items TO billing_runtime;
      rollback:
        - sql:
            sql: REVOKE SELECT, INSERT ON billing.encounter_accounts, billing.billable_items FROM billing_runtime;

  - changeSet:
      id: billing-011-invoice-read-permissions
      author: di-lucca
      dbms: postgresql
      changes:
        - sql:
            sql: GRANT SELECT ON billing.invoices, billing.invoice_items TO billing_runtime;
      rollback:
        - sql:
            sql: REVOKE SELECT ON billing.invoices, billing.invoice_items FROM billing_runtime;

  - changeSet:
      id: billing-013-invoice-draft-permissions
      author: di-lucca
      dbms: postgresql
      changes:
        - sql:
            sql: GRANT INSERT ON billing.invoices, billing.invoice_items TO billing_runtime; GRANT SELECT, INSERT ON billing.invoice_appointment_validations TO billing_runtime; GRANT UPDATE(status,version,updated_at) ON billing.billable_items TO billing_runtime;
      rollback:
        - sql:
            sql: REVOKE INSERT ON billing.invoices, billing.invoice_items FROM billing_runtime; REVOKE SELECT, INSERT ON billing.invoice_appointment_validations FROM billing_runtime; REVOKE UPDATE(status,version,updated_at) ON billing.billable_items FROM billing_runtime;

  - changeSet:
      id: billing-015-invoice-issuance-permissions
      author: di-lucca
      dbms: postgresql
      changes:
        - sql:
            sql: GRANT SELECT, INSERT ON billing.outbox_events, billing.invoice_issuances TO billing_runtime; GRANT UPDATE(status,version,updated_at,invoice_number,issued_at) ON billing.invoices TO billing_runtime;
      rollback:
        - sql:
            sql: REVOKE SELECT, INSERT ON billing.outbox_events, billing.invoice_issuances FROM billing_runtime; REVOKE UPDATE(status,version,updated_at,invoice_number,issued_at) ON billing.invoices FROM billing_runtime;
