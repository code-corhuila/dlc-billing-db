name: CI

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migrations and run SQL suites on a disposable database
        run: python tests/run-isolated.py
      - name: Upgrade, roll back and restore on a disposable database
        run: python tests/run-isolated.py --upgrade --restore
